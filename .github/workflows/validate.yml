name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGY_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.4.7-5900205422411776/linux-x64/cli_linux_x64.tar.gz
      AGY_SHA512: beda760587589f5827b0b516c3ec2c5bd5cd2e91eb0e2533807ba1e990a27dcd63aef0191e0b76fb60feab0d16eaa8210fb79842c34dd4809e257e1712edd152
      MCP_PUBLISHER_VERSION: v1.8.9
      CURSOR_SCHEMA: https://raw.githubusercontent.com/cursor/plugins/5229aad76c37451561c5b81a9b5072ae1c549a5b/schemas/plugin.schema.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check manifests agree and skills are well formed
        run: node scripts/check-manifests.mjs

      - name: Validate manifests against published schemas
        run: |
          mkdir -p "$RUNNER_TEMP/schemas"
          cd "$RUNNER_TEMP/schemas"
          curl -fsSL -o ap-plugin.json https://agent-plugins.org/schemas/1.0.0/plugin.schema.json
          curl -fsSL -o ap-mcp.json https://agent-plugins.org/schemas/1.0.0/mcp.schema.json
          curl -fsSL -o agy-plugin.json https://antigravity.google/schemas/v1/plugin.json
          curl -fsSL -o cursor-plugin.json "$CURSOR_SCHEMA"
          cd "$GITHUB_WORKSPACE"
          ajv() { npx -y -p ajv-cli@5 -p ajv-formats@3 ajv validate --strict=false -c ajv-formats "$@"; }
          ajv --spec=draft2020 -s "$RUNNER_TEMP/schemas/ap-plugin.json" -d plugin.json
          ajv --spec=draft2020 -s "$RUNNER_TEMP/schemas/ap-mcp.json" -d mcp.json
          ajv --spec=draft2020 -s "$RUNNER_TEMP/schemas/agy-plugin.json" -d .antigravity-plugin/plugin.json
          ajv --spec=draft7 -s "$RUNNER_TEMP/schemas/cursor-plugin.json" -d .cursor-plugin/plugin.json

      - name: Validate Claude plugin
        run: npx -y @anthropic-ai/claude-code@2.1.326 plugin validate . --strict

      - name: Validate Gemini extension
        run: |
          output=$(npx -y @google/gemini-cli@0.68.0 extensions validate . 2>&1)
          echo "$output"
          ! grep -qi 'warning' <<<"$output"

      - name: Validate Antigravity plugin
        run: |
          curl -fsSL -o "$RUNNER_TEMP/agy.tar.gz" "$AGY_URL"
          echo "$AGY_SHA512  $RUNNER_TEMP/agy.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/agy.tar.gz" -C "$RUNNER_TEMP" antigravity
          # Antigravity warns about other agents' files, which are expected.
          # skills/devboxes/SKILL.md is over Antigravity's 24,000-byte skill limit until it is shortened.
          "$RUNNER_TEMP/antigravity" plugin validate --json . | jq -e '
            [.findings[] | select(
              .severity == "error" or (
                .severity == "warning" and
                (.file | IN(".mcp.json", "mcp.json", "plugin.json", "GEMINI.md", "skills/devboxes/SKILL.md") | not)
              )
            )] | length == 0'

      - name: Validate MCP Registry entry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" validate server.json
